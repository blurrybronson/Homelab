server {
	listen 8443 ssl;
	http2 on;
	server_name vault.brtechlabs.com www.vault.brtechlabs.com;

	ssl_certificate /etc/nginx/certs/vault/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/vault/privkey.pem;

	location / {
		proxy_pass https://vault_prod:8200;

    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto https;

    		proxy_http_version 1.1;
    		proxy_set_header Connection "";
    		proxy_buffering off;
		proxy_ssl_name vault.brtechlabs.com;
		
		# this line is used to deny web access to machines reaching across Tailscale
		deny 100.64.0.0/10;
	}
}
