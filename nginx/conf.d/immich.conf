server {
	listen 8443 ssl;
	http2 on;
	server_name immich.brtechlabs.com www.immich.brtechlabs.com;

	ssl_certificate /etc/nginx/certs/immich/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/immich/privkey.pem;

	client_max_body_size 50000M;
	proxy_request_buffering off;
	client_body_buffer_size 1024k;

	resolver 10.89.0.1 valid=10s;

	location / {
		set $immich_upstream immich_server;
		proxy_pass http://$immich_upstream:2283;

    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto https;

    		proxy_http_version 1.1;
    		proxy_set_header Connection "upgrade";
		proxy_set_header Upgrade $http_upgrade;
    		proxy_buffering off;
		proxy_ssl_name immich.brtechlabs.com;
		
		# this line is used to deny web access to machines reaching across Tailscale
		# deny 100.64.0.0/10;
	}
}
