server {
	listen 8443 ssl;
	http2 on;
	server_name immich.brtechlabs.com www.immich.brtechlabs.com;

	ssl_certificate /etc/nginx/certs/immich/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/immich/privkey.pem;

	location / {
		proxy_pass https://immich_server:2283;

    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto https;
		proxy_ssl_name immich.brtechlabs.com;
    		proxy_http_version 1.1;
    		proxy_set_header Connection "";
    		proxy_buffering off;

		# this line is used to deny web access to machines reaching across Tailscale
		# deny 100.64.0.0/10;
	}
}
